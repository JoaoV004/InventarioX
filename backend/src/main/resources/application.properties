
# primary datasource; use env vars to override for CI or production
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/catalog_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:${username}}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:${password}}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

