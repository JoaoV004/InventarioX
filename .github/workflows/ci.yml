name: CI - Back && Front

on:
  push:
  pull_request:

jobs:

  frontend:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  backend:
    name: Build Backend
    runs-on: ubuntu-latest
    # for testing we use an in‑memory H2 database (configured under src/test/resources)
    # no external DB is required during the Maven build.  If you later decide to run
    # integration tests against MySQL, uncomment the `services` block below and
    # provide matching credentials via the `env` section.
    env:
      SPRING_DATASOURCE_URL: jdbc:h2:mem:testdb
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ""

    #services:
    #  mysql:
    #    image: mysql:8
    #    env:
    #      MYSQL_ROOT_PASSWORD: root
    #      MYSQL_DATABASE: catalog_db
    #    ports:
    #      - 3306:3306
    #    options: >-
    #      --health-cmd="mysqladmin ping --silent"
    #      --health-interval=10s
    #      --health-timeout=5s
    #      --health-retries=3

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Build with Maven
        working-directory: backend
        run: mvn clean verify